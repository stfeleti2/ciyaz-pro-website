<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" role="img" aria-labelledby="title description"><title id="title">Ciyaz Pro Wet and Wild poster-style artwork</title><desc id="description">Electric blue and magenta neon title over a nighttime pool</desc>
<defs><radialGradient id="night"><stop stop-color="#4d096b"/><stop offset=".55" stop-color="#070b32"/><stop offset="1" stop-color="#010615"/></radialGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#20faff"/><stop offset=".43" stop-color="#00aafa"/><stop offset=".7" stop-color="#a852ff"/><stop offset="1" stop-color="#ff45dc"/></linearGradient><linearGradient id="pink" x2="1" y2="0"><stop stop-color="#f800e1"/><stop offset="1" stop-color="#31e5fe"/></linearGradient><filter id="neon" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur stdDeviation="38"/></filter><pattern id="water" width="180" height="85" patternUnits="userSpaceOnUse"><path d="M-20 30 Q30 5 80 30 T180 30 M-10 69 Q40 45 90 69 T190 69" fill="none" stroke="#00efff" stroke-width="9" opacity=".6"/><path d="M15 46 Q60 18 110 46 T210 46" fill="none" stroke="#ff2ee4" stroke-width="6" opacity=".35"/></pattern></defs>
<rect width="1000" height="1250" fill="url(#night)"/><ellipse cx="150" cy="200" rx="340" ry="380" fill="#fe00b0" opacity=".2" filter="url(#soft)"/><ellipse cx="800" cy="410" rx="350" ry="400" fill="#0ff" opacity=".18" filter="url(#soft)"/><rect y="665" width="1000" height="585" fill="#008fc6" opacity=".5"/><rect y="665" width="1000" height="585" fill="url(#water)"/><path d="M0 675Q250 590 500 680 T1000 655 V1250 H0Z" fill="#00d6f7" opacity=".15"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="500" y="98" fill="white" font-size="32" font-weight="800" letter-spacing="8">CIYAZ PRO KITCHENS</text><g transform="rotate(-7 500 420)" font-style="italic" font-weight="900" letter-spacing="-14" stroke="#071737" stroke-width="18" paint-order="stroke" filter="url(#neon)"><text x="505" y="380" fill="url(#blue)" font-size="242" textLength="830" lengthAdjust="spacingAndGlyphs">WET'N</text><text x="507" y="592" fill="url(#pink)" font-size="276" textLength="800" lengthAdjust="spacingAndGlyphs">WILD</text></g><text x="500" y="650" fill="#ff4ef3" font-size="69" font-weight="900" filter="url(#neon)">POOL PARTY</text></g><circle cx="145" cy="888" r="95" fill="#ef24d9" opacity=".18"/><circle cx="800" cy="960" r="165" fill="#15deff" opacity=".22"/><path d="M0 1030 Q250 950 500 1020 T1000 1000" stroke="#71ffff" stroke-width="13" opacity=".65" fill="none"/><path d="M0 1080 Q250 1000 500 1060 T1000 1040" stroke="#ff3bdb" stroke-width="10" opacity=".45" fill="none"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="500" y="1162" fill="white" font-size="32" font-weight="900" letter-spacing="7">FOOD · MUSIC · POOL</text><text x="500" y="1212" fill="#66f7ff" font-size="21" font-weight="700" letter-spacing="5">LEONDALE · GAUTENG</text></g>
